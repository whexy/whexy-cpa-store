<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width,initial-scale=1" />
    <title>Model Groups</title>
    <style>
      :root {
        --font-sans:
          -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Ubuntu,
          Cantarell, "Helvetica Neue", sans-serif;
        --font-mono:
          ui-monospace, SFMono-Regular, "SF Mono", Menlo, Consolas, monospace;
        --radius: 8px;
        /* Management Center floats its toolbar (and, when narrow, its menu
           button) over the top 76px of the frame. */
        --toolbar-clearance: 84px;
        --bg-page: #faf9f5;
        --bg-card: #f0eee8;
        --bg-subtle: #e9e6df;
        --bg-hover: #e2ded6;
        --fg: #2d2a26;
        --fg-2: #6d6760;
        --fg-3: #a29c95;
        --fg-4: #c0bab3;
        --line: #e3e1db;
        --line-2: #d5d2cb;
        --line-3: #cecac4;
        --accent: #8b8680;
        --accent-hover: #7f7a74;
        --accent-contrast: #ffffff;
        --ok: #10b981;
        --ok-text: #065f46;
        --warn: #c65746;
        --warn-text: #8a3a30;
        --amber: #d97706;
        --amber-text: #92400e;
        --scrim: rgba(45, 42, 38, 0.28);
        --hover-bg: rgba(0, 0, 0, 0.03);
        color-scheme: light;
      }
      [data-theme="white"] {
        --bg-page: #fff;
        --bg-card: #fff;
        --bg-subtle: #f6f6f6;
        --bg-hover: #eee;
        --line: #e5e5e5;
        --line-2: #d5d5d5;
        --line-3: #ccc;
      }
      [data-theme="dark"] {
        --bg-page: #151412;
        --bg-card: #1d1b18;
        --bg-subtle: #262320;
        --bg-hover: #2e2a26;
        --fg: #f6f4f1;
        --fg-2: #c9c3bb;
        --fg-3: #9c958d;
        --fg-4: #6f6962;
        --line: #3a3530;
        --line-2: #4a453f;
        --line-3: #5a544d;
        --accent-hover: #9a948e;
        --ok: #0fae78;
        --ok-text: #6ee7b7;
        --warn-text: #f1b0a6;
        --amber: #f59e0b;
        --amber-text: #fcd34d;
        --scrim: rgba(0, 0, 0, 0.45);
        --hover-bg: rgba(255, 255, 255, 0.04);
        color-scheme: dark;
      }
      * {
        box-sizing: border-box;
      }
      body {
        margin: 0;
        font-family: var(--font-sans);
        background: var(--bg-page);
        color: var(--fg);
        font-size: 13px;
        line-height: 1.45;
      }
      [hidden] {
        display: none !important;
      }
      .page {
        flex: 1;
        min-width: 0;
        padding: var(--toolbar-clearance) 18px 22px;
        display: flex;
        flex-direction: column;
        gap: 14px;
        position: relative;
      }
      .head {
        display: flex;
        align-items: center;
        gap: 10px;
      }
      .head h1 {
        margin: 0;
        font-size: 15px;
        font-weight: 600;
        letter-spacing: 0.01em;
      }
      .head .spacer {
        flex: 1;
      }
      .facts {
        display: flex;
        flex-wrap: wrap;
        gap: 6px;
      }
      .fact {
        display: inline-flex;
        align-items: center;
        gap: 6px;
        font-size: 11px;
        color: var(--fg-3);
        background: var(--bg-subtle);
        border: 1px solid var(--line);
        border-radius: 999px;
        padding: 2px 9px;
      }
      .fact b {
        color: var(--fg-2);
        font-weight: 600;
      }
      .fact.warn {
        color: var(--warn-text);
        border-color: color-mix(in srgb, var(--warn) 35%, transparent);
        background: color-mix(in srgb, var(--warn) 12%, transparent);
      }
      .fact .dot {
        width: 6px;
        height: 6px;
        border-radius: 50%;
        background: var(--ok);
      }
      .fact.warn .dot {
        background: var(--warn);
      }

      .btn {
        border: 1px solid var(--line-2);
        background: var(--bg-card);
        color: var(--fg);
        font: inherit;
        font-size: 12px;
        padding: 5px 11px;
        border-radius: 6px;
        cursor: pointer;
      }
      .btn:hover {
        background: var(--bg-hover);
      }
      .btn.primary {
        background: var(--accent);
        border-color: var(--accent);
        color: var(--accent-contrast);
        font-weight: 600;
      }
      .btn.ghost {
        background: transparent;
        border-color: transparent;
        color: var(--fg-2);
      }
      .btn.ghost:hover {
        background: var(--hover-bg);
        color: var(--fg);
      }

      .group {
        border: 1px solid var(--line);
        border-radius: var(--radius);
        background: var(--bg-card);
        overflow: hidden;
      }
      .group + .group {
        margin-top: 10px;
      }
      .group .row {
        display: flex;
        align-items: flex-start;
        gap: 10px;
        padding: 11px 12px;
      }
      .group.open .row {
        border-bottom: 1px solid var(--line);
      }
      .gid {
        font-family: var(--font-mono);
        font-size: 12.5px;
        color: var(--fg);
      }
      .gid .copy {
        margin-left: 6px;
        color: var(--fg-4);
        cursor: pointer;
      }
      .sub {
        display: flex;
        flex-wrap: wrap;
        gap: 6px;
        margin-top: 7px;
      }
      .chip {
        display: inline-flex;
        flex-wrap: wrap;
        align-items: center;
        gap: 0 5px;
        font-size: 11px;
        border: 1px solid var(--line);
        border-radius: 5px;
        padding: 1px 6px;
        color: var(--fg-2);
        background: var(--bg-page);
      }
      .chip .mono {
        font-family: var(--font-mono);
        font-size: 11px;
      }
      .chip .prov {
        color: var(--fg-3);
        font-size: 10px;
        letter-spacing: 0.02em;
        text-transform: lowercase;
      }
      .chip.warn {
        color: var(--warn-text);
        border-color: color-mix(in srgb, var(--warn) 35%, transparent);
        background: color-mix(in srgb, var(--warn) 10%, transparent);
      }
      .chip.amber {
        color: var(--amber-text);
        border-color: color-mix(in srgb, var(--amber) 35%, transparent);
        background: color-mix(in srgb, var(--amber) 10%, transparent);
      }
      .chip.plain {
        border-style: dashed;
      }
      .meta {
        display: flex;
        align-items: center;
        gap: 14px;
        color: var(--fg-3);
        font-size: 11.5px;
        white-space: nowrap;
        padding-top: 2px;
      }
      .meta .num {
        color: var(--fg-2);
        font-variant-numeric: tabular-nums;
      }
      .caret {
        color: var(--fg-4);
        padding-top: 3px;
      }

      .body {
        padding: 4px 12px 12px;
      }
      table {
        width: 100%;
        border-collapse: collapse;
        font-size: 12px;
      }
      th {
        text-align: left;
        font-weight: 500;
        color: var(--fg-3);
        font-size: 10.5px;
        letter-spacing: 0.03em;
        text-transform: uppercase;
        padding: 8px 6px 6px;
      }
      td {
        padding: 7px 6px;
        border-top: 1px solid var(--line);
        vertical-align: middle;
      }
      td.mono,
      th.mono {
        font-family: var(--font-mono);
        font-size: 11.5px;
      }
      td.num {
        font-variant-numeric: tabular-nums;
        color: var(--fg-2);
        text-align: right;
      }
      .meter {
        height: 5px;
        border-radius: 3px;
        background: var(--bg-subtle);
        overflow: hidden;
        min-width: 54px;
      }
      .meter span {
        display: block;
        height: 100%;
        background: var(--accent);
      }
      .meter.zero span {
        background: transparent;
      }
      .sec-title {
        display: flex;
        align-items: center;
        gap: 8px;
        margin: 12px 0 2px;
        font-size: 11px;
        color: var(--fg-3);
        text-transform: uppercase;
        letter-spacing: 0.04em;
      }
      .sec-title .spacer {
        flex: 1;
      }

      .scrim {
        position: absolute;
        inset: 0;
        background: rgba(0, 0, 0, 0.45);
      }
      .scrim {
        background: rgba(45, 42, 38, 0.28);
      }
      .drawer {
        position: absolute;
        top: 0;
        right: 0;
        bottom: 0;
        width: 430px;
        background: var(--bg-card);
        border-left: 1px solid var(--line-2);
        display: flex;
        flex-direction: column;
      }
      .drawer .dhead {
        padding: var(--toolbar-clearance) 14px 10px;
        border-bottom: 1px solid var(--line);
        display: flex;
        flex-direction: column;
        gap: 8px;
      }
      .drawer .dbody {
        padding: 12px 14px;
        display: flex;
        flex-direction: column;
        gap: 14px;
        overflow: auto;
      }
      .drawer .dfoot {
        margin-top: auto;
        padding: 10px 14px;
        border-top: 1px solid var(--line);
        display: flex;
        align-items: center;
        gap: 8px;
      }
      .drawer .dfoot .spacer {
        flex: 1;
      }
      label.f {
        display: flex;
        flex-direction: column;
        gap: 5px;
        font-size: 11px;
        color: var(--fg-3);
      }
      input[type="text"],
      select {
        font: inherit;
        font-size: 12.5px;
        color: var(--fg);
        background: var(--bg-page);
        border: 1px solid var(--line-2);
        border-radius: 6px;
        padding: 5px 8px;
        width: 100%;
      }
      .seg {
        display: flex;
        border: 1px solid var(--line-2);
        border-radius: 6px;
        overflow: hidden;
      }
      .seg button {
        flex: 1;
        font: inherit;
        font-size: 11.5px;
        padding: 5px 4px;
        background: var(--bg-page);
        color: var(--fg-3);
        border: 0;
        border-right: 1px solid var(--line);
        cursor: pointer;
      }
      .seg button:last-child {
        border-right: 0;
      }
      .seg button[aria-pressed="true"] {
        background: var(--accent);
        color: var(--accent-contrast);
        font-weight: 600;
      }
      .note {
        font-size: 11px;
        color: var(--fg-3);
      }
      .mrow {
        display: grid;
        grid-template-columns: auto minmax(0, 1fr) auto auto;
        align-items: center;
        gap: 6px 8px;
        padding: 7px 8px;
        border: 1px solid var(--line);
        border-radius: 6px;
        background: var(--bg-page);
      }
      .mrow + .mrow {
        margin-top: 6px;
      }
      .mrow .grip {
        color: var(--fg-4);
        cursor: grab;
        font-size: 12px;
      }
      .mrow .m {
        flex: 1;
        min-width: 0;
      }
      .mrow .m .id {
        font-family: var(--font-mono);
        font-size: 11.5px;
        white-space: nowrap;
        overflow: hidden;
        text-overflow: ellipsis;
        display: block;
      }
      .mrow input[type="text"] {
        width: 46px;
        text-align: center;
      }
      .mrow select {
        width: auto;
        font-size: 11.5px;
        padding: 4px 6px;
      }
      .mrow .limits {
        display: block;
        color: var(--amber-text);
      }
      .caps {
        display: grid;
        grid-template-columns: auto minmax(0, 1fr);
        gap: 4px 12px;
        margin: 0;
        font-size: 12px;
      }
      .caps dt {
        color: var(--fg-3);
      }
      .caps dd {
        margin: 0;
        font-family: var(--font-mono);
        font-size: 11.5px;
        overflow-wrap: anywhere;
      }
      .pick {
        border: 1px solid var(--line);
        border-radius: 6px;
        overflow: hidden;
      }
      .pick .search {
        padding: 8px;
        border-bottom: 1px solid var(--line);
      }
      .pick ul {
        list-style: none;
        margin: 0;
        padding: 4px;
        max-height: 132px;
        overflow: auto;
      }
      .pick li {
        display: flex;
        align-items: center;
        gap: 8px;
        padding: 5px 6px;
        border-radius: 5px;
        font-size: 12px;
      }
      .pick li:hover {
        background: var(--hover-bg);
      }
      .pick li .box {
        width: 13px;
        height: 13px;
        border: 1px solid var(--line-2);
        border-radius: 3px;
        display: flex;
        align-items: center;
        justify-content: center;
        font-size: 10px;
        color: var(--accent-contrast);
      }
      .pick li[data-on="1"] .box {
        background: var(--accent);
        border-color: var(--accent);
      }
      .pick li .m {
        flex: 1;
        min-width: 0;
        font-family: var(--font-mono);
        font-size: 11.5px;
        white-space: nowrap;
        overflow: hidden;
        text-overflow: ellipsis;
      }
      .pick li .st {
        font-size: 10.5px;
        color: var(--fg-3);
        white-space: nowrap;
      }
      .pick li .st.warn {
        color: var(--warn-text);
      }
      .pick li .st.amber {
        color: var(--amber-text);
      }
      .switch {
        display: flex;
        align-items: center;
        gap: 8px;
        font-size: 12px;
        color: var(--fg-2);
      }
      .switch .t {
        width: 30px;
        height: 17px;
        border-radius: 999px;
        background: var(--bg-subtle);
        border: 1px solid var(--line-2);
        position: relative;
        flex: 0 0 auto;
      }
      .switch .t::after {
        content: "";
        position: absolute;
        top: 2px;
        left: 2px;
        width: 11px;
        height: 11px;
        border-radius: 50%;
        background: var(--fg-3);
      }
      .switch[data-on="1"] .t {
        background: var(--accent);
        border-color: var(--accent);
      }
      .switch[data-on="1"] .t::after {
        left: 15px;
        background: #fff;
      }
      .stackrow {
        display: flex;
        align-items: center;
        gap: 8px;
        font-size: 12px;
      }
      .stackrow .k {
        color: var(--fg-3);
        font-size: 11.5px;
      }

      .page {
        max-width: 1200px;
        margin: auto;
        min-height: 100vh;
      }
      .spacer,
      .grow {
        flex: 1;
        min-width: 0;
      }
      .mono {
        font-family: var(--font-mono);
      }
      :focus-visible {
        outline: 2px solid var(--accent);
        outline-offset: 3px;
      }
      button:disabled {
        opacity: 0.5;
        cursor: default;
      }
      .btn.primary:hover {
        background: var(--accent-hover);
      }
      .btn.danger {
        background: var(--warn);
        border-color: var(--warn);
        color: #ffffff;
        font-weight: 600;
      }
      .btn.danger:hover {
        background: color-mix(in srgb, var(--warn) 85%, #000000);
      }
      #delete {
        color: var(--warn-text);
      }
      .error {
        color: var(--warn-text);
        font-size: 12px;
        margin: 0;
        white-space: pre-wrap;
        overflow-wrap: anywhere;
      }
      .empty {
        padding: 32px;
        text-align: center;
        border: 1px dashed var(--line);
        border-radius: 8px;
      }
      .expander {
        border: 0;
        background: transparent;
        color: inherit;
        text-align: left;
        font: inherit;
        padding: 0;
        cursor: pointer;
        display: flex;
        gap: 10px;
        align-items: flex-start;
        flex: 1;
        min-width: 0;
      }
      .gid {
        overflow-wrap: anywhere;
      }
      .copy {
        padding: 0 4px;
        border: 0;
        background: transparent;
        font: inherit;
        color: var(--fg-3);
        cursor: pointer;
      }
      .copy-id {
        position: relative;
        width: 18px;
        height: 18px;
        vertical-align: middle;
      }
      .copy-id::before,
      .copy-id::after {
        content: "";
        position: absolute;
        width: 8px;
        height: 9px;
        border: 1px solid currentColor;
        border-radius: 1px;
      }
      .copy-id::before {
        top: calc(50% - 7px);
        left: calc(50% - 6px);
      }
      .copy-id::after {
        top: calc(50% - 4px);
        left: calc(50% - 3px);
        background: var(--bg-card);
      }
      .table-wrap {
        overflow: auto;
      }
      th.num {
        text-align: right;
      }
      .share {
        width: 96px;
      }
      progress.meter {
        appearance: none;
        border: 0;
        width: 100%;
        display: block;
        height: 5px;
        background: var(--bg-subtle);
      }
      progress.meter::-webkit-progress-bar {
        background: var(--bg-subtle);
        border-radius: 3px;
      }
      progress.meter::-webkit-progress-value {
        background: var(--accent);
        border-radius: 3px;
      }
      progress.meter::-moz-progress-bar {
        background: var(--accent);
        border-radius: 3px;
      }
      .share-value {
        font-size: 10.5px;
        color: var(--fg-2);
      }
      .scrim {
        background: var(--scrim);
        position: fixed;
        z-index: 2;
      }
      .drawer {
        position: fixed;
        z-index: 3;
        width: min(430px, 100%);
        margin: 0;
      }
      .drawer:focus {
        outline: none;
      }
      .dbody {
        flex: 1;
        min-height: 0;
      }
      .field-stack {
        display: flex;
        flex-direction: column;
        gap: 6px;
      }
      .session-controls {
        display: flex;
        flex-direction: column;
        gap: 8px;
      }
      .section-label {
        margin-bottom: 6px;
      }
      .mrow .m {
        grid-area: 1 / 2;
      }
      .mrow .weight {
        grid-area: 1 / 3;
      }
      .mrow .remove {
        grid-area: 1 / 4;
      }
      .mrow .provider {
        grid-area: 2 / 2 / 3 / 4;
      }
      .mrow input[type="number"] {
        width: 52px;
        text-align: center;
        font: inherit;
        font-size: 12px;
        color: var(--fg);
        background: var(--bg-page);
        border: 1px solid var(--line-2);
        border-radius: 6px;
        padding: 4px;
      }
      .mrow label {
        display: flex;
        flex-direction: column;
        gap: 2px;
        font-size: 10px;
        color: var(--fg-3);
      }
      .order {
        display: flex;
        flex-direction: column;
      }
      .order button {
        border: 0;
        background: transparent;
        color: var(--fg-3);
        cursor: pointer;
        font-size: 10px;
        padding: 0 3px;
      }
      .pick label {
        display: flex;
        align-items: center;
        gap: 8px;
        width: 100%;
        cursor: pointer;
      }
      .pick input[type="checkbox"] {
        accent-color: var(--accent);
        margin: 0;
      }
      .switch {
        position: relative;
        cursor: pointer;
      }
      .switch input {
        position: absolute;
        opacity: 0;
        width: 30px;
        height: 17px;
        margin: 0;
      }
      .switch input:focus-visible + .t {
        outline: 2px solid var(--accent);
        outline-offset: 3px;
      }
      .switch input:checked + .t {
        background: var(--accent);
        border-color: var(--accent);
      }
      .switch input:checked + .t::after {
        left: 15px;
        background: #fff;
      }
      .stackrow select {
        width: auto;
      }
      .sr-only {
        position: absolute;
        width: 1px;
        height: 1px;
        padding: 0;
        margin: -1px;
        overflow: hidden;
        clip-path: inset(50%);
        white-space: nowrap;
        border: 0;
      }
      #auth {
        max-width: 360px;
        padding: 20px;
        border: 1px solid var(--line);
        border-radius: 8px;
        display: flex;
        flex-direction: column;
        gap: 10px;
      }
      #auth input {
        font: inherit;
        padding: 7px;
        color: var(--fg);
        background: var(--bg-page);
        border: 1px solid var(--line-2);
        border-radius: 6px;
      }
      @media (max-width: 700px) {
        .page {
          padding-inline: 12px;
        }
        /* The ID shares its line with copy and Edit, and the summary spans the
           card below it. The expander takes the row's tracks as a subgrid so
           the ID stays clear of the buttons laid over its right side. */
        .group .row {
          display: grid;
          grid-template-columns: minmax(0, 1fr) auto auto;
          align-items: center;
          gap: 8px 4px;
        }
        .expander {
          grid-area: 1 / 1 / 4 / -1;
          display: grid;
          grid-template: subgrid / subgrid;
          align-items: center;
          gap: normal;
        }
        .expander > .grow {
          display: contents;
        }
        .expander .gid {
          grid-area: 1 / 1;
        }
        .expander .meta {
          grid-area: 2 / 1 / 3 / -1;
          flex-wrap: wrap;
          gap: 4px 14px;
          padding-top: 0;
        }
        .expander .sub {
          grid-area: 3 / 1 / 4 / -1;
          margin-top: 0;
        }
        .row > .copy-id {
          grid-area: 1 / 2;
        }
        .row > .btn {
          grid-area: 1 / 3;
        }
        /* The member chips above the table already name each member's
           providers. */
        .members .providers {
          display: none;
        }
        .share {
          width: 76px;
        }
        .sessions,
        .sessions tbody {
          display: block;
        }
        .sessions thead {
          display: none;
        }
        .sessions tr {
          display: grid;
          grid-template-columns: minmax(0, 1fr) auto auto;
          grid-template-areas:
            "member last action"
            "account account action"
            "session session action";
          align-items: center;
          gap: 4px 8px;
          padding: 7px 6px;
          border-top: 1px solid var(--line);
        }
        .sessions td {

      const LIMITS = {
        context_length: "context_length",
        max_completion_tokens: "max_completion_tokens",
        input_token_limit: "inputTokenLimit",
        output_token_limit: "outputTokenLimit",

      function names(values) {

                onchange: (event) => {
                  member.providers =
                    event.target.value === ""
                      ? [...known]
                      : [event.target.value];
                  member.changed = !equalList(
                    member.previous,
                    member.providers,
                  );
                  renderEditor();
                  $(id).focus();
                },
              });
              select.append(
                h(
                  "option",
                  { value: "" },
                  "auto · " + known.length + " providers",
                ),
                ...choices.map((provider) =>
                  h(
                    "option",
                    { value: provider, disabled: !known.includes(provider) },
                    provider,
                  ),
                ),
              );
              select.value =
                member.providers.length === 1 ? member.providers[0] : "";
              row.append(
                h("label", { class: "provider", for: id }, "Provider", select),
              );
            }
            const weightID = "weight-" + index;
            const weight = h("input", {
              id: weightID,
              type: "number",
              min: 1,
              max: 1000,
              step: 1,
              required: true,
              value: member.weight,
              disabled: draft.policy !== "weighted-round-robin",
              oninput: (event) => {
                member.weight = Number(event.target.value);
              },
            });
            row.append(
              h("label", { class: "weight", for: weightID }, "Weight", weight),
              button(
                "×",
                () => {
                  draft.members.splice(index, 1);
                  renderEditor();
                  renderPicker();
                },
                "copy remove",
                { "aria-label": "Remove · " + member.model },
              ),
            );
            return row;
          }),
        );
      }
      function moveMember(index, delta) {
        [draft.members[index], draft.members[index + delta]] = [
          draft.members[index + delta],
          draft.members[index],
        ];
        renderEditor();
        const buttons =
          $("members").children[index + delta].querySelectorAll(
            ".order button",
          );
        (buttons[delta < 0 ? 0 : 1].disabled
          ? buttons[delta < 0 ? 1 : 0]
          : buttons[delta < 0 ? 0 : 1]
        ).focus();
      }
      function renderPicker() {
        if (!draft) return;
        const query = $("search").value.trim().toLowerCase();
        $("catalog").replaceChildren(
          ...[...catalog.values()]
            .filter((model) =>
              [model.model, model.display_name, ...model.providers.keys()]
                .filter(Boolean)
                .join(" ")
                .toLowerCase()
                .includes(query),
            )
            .map((model) => {
              const selected = draft.members.some(
                (member) => member.model === model.model,
              );
              const counts = [...model.providers.values()];
              const credentials = counts.reduce(
                (sum, provider) => sum + provider.credentials,
                0,
              );
              const ready = counts.reduce(
                (sum, provider) => sum + provider.ready,
                0,
              );
              const cooling = counts.reduce(
                (sum, provider) => sum + provider.cooling,
                0,
              );
              const providers = [...model.providers.keys()];
              const prefix =
                providers.length === 1
                  ? providers[0]
                  : providers.length + " providers";
              const status = !credentials
                ? "unavailable"
                : !ready && cooling
                  ? "cooling"
                  : "ready";
              const detail = !credentials
                ? "no credentials"
                : cooling
                  ? cooling + " cooling"
                  : credentials +
                    (credentials === 1 ? " credential" : " credentials");
              const box = h("input", {
                type: "checkbox",
                "aria-label": model.model,
                disabled: !providers.length && !selected,
                onchange: (event) => {
                  if (event.target.checked)
                    draft.members.push({
                      model: model.model,
                      providers,
                      weight: 1,
                      previous: providers,
                      changed: false,
                    });
                  else
                    draft.members = draft.members.filter(
                      (member) => member.model !== model.model,
                    );
                  renderEditor();
                  renderPicker();
                },
              });
              box.checked = selected;
              return h(
                "li",
                { "data-on": selected ? "1" : "0" },
                h(
                  "label",
                  {},
                  box,
                  h(
                    "span",
                    { class: "m", title: model.display_name },
                    model.model,
                  ),
                  h(
                    "span",
                    { class: "st " + tone(status) },
                    providers.length
                      ? prefix + " · " + detail
                      : "provider unknown",
                  ),
                ),
              );
            }),
        );
      }
      function validation() {
        if (!/^[a-z0-9-]+$/.test(draft.slug)) return "Slug · [a-z0-9-]+";
        if (!draft.members.length) return "Members · at least one member";
        const pairs = new Set();
        for (const member of draft.members) {
          if (!knownProviders(member.model).length)
            return member.model + " · no provider in CPA serves this model";
          if (
            !Number.isInteger(member.weight) ||
            member.weight < 1 ||
            member.weight > 1000
          )
            return member.model + " · Weight · 1..1000";
          for (const provider of member.providers) {
            const pair = JSON.stringify([member.model, provider]);
            if (pairs.has(pair))
              return member.model + " · " + provider + " · duplicate member";
            pairs.add(pair);
          }
        }
        return "";
      }
      $("name").addEventListener("input", () => {
        if (!$("slug").dataset.manual)
          $("slug").value = $("name")
            .value.toLowerCase()
            .normalize("NFKD")
            .replace(/[\u0300-\u036f]/g, "")
            .replace(/[^a-z0-9]+/g, "-")
            .replace(/^-+|-+$/g, "");
        updatePreview();
      });
      $("slug").addEventListener("input", () => {
        $("slug").dataset.manual = "true";
        updatePreview();
      });
      $("search").addEventListener("input", renderPicker);
      $("cancel").addEventListener("click", closeEditor);
      $("scrim").addEventListener("click", closeEditor);
      $("new").addEventListener("click", (event) =>
        openEditor(null, event.currentTarget),
      );
      $("reload").addEventListener("click", reload);
      document.addEventListener("keydown", (event) => {
        if ($("editor").hidden) return;
        if (event.key === "Escape") {
          event.preventDefault();
          if ($("confirm").hidden) closeEditor();
          else if (!saving) {
            setConfirm(false);
            $("delete").focus();
          }
        }
        if (event.key === "Tab") {
          const elements = [
            ...$("editor").querySelectorAll(
              "button:not(:disabled),input:not(:disabled),select:not(:disabled)",
            ),
          ].filter((element) => !element.closest("[hidden],[inert]"));
          const first = elements[0],
            last = elements.at(-1);
          if (!first) event.preventDefault();
          else if (
            event.shiftKey &&
            [first, $("editor")].includes(document.activeElement)
          ) {
            event.preventDefault();
            last.focus();
          } else if (!event.shiftKey && document.activeElement === last) {
            event.preventDefault();
            first.focus();
          }
        }
      });
      $("editor").addEventListener("submit", async (event) => {
        event.preventDefault();
        if (saving) return;
        draft.members.forEach((member) => {
          member.providers = resolvedProviders(member.model, member.providers);
        });
        const error = validation();
        showError("editor-error", error);
        if (error) return;
        await commit(async (latest, groups, index) => {
          if (
            groups.some((group, i) => i !== index && group.slug === draft.slug)
          )
            throw new Error("Slug · " + draft.slug + " · unique");
          const next = {
            ...draft,
            members: draft.members.map(({ model, providers, weight }) => ({
              model,
              providers,
              weight,
            })),
            capabilities: draftCapabilities().capabilities,
          };
          if (!Object.keys(next.capabilities).length) delete next.capabilities;
          if (index < 0) groups.push(next);
          else groups[index] = next;
          const affinity = {
            ...latest?.affinity,
            enabled: $("keep").checked,
            rebind_on_failure: $("rebind").checked,
          };
          if ($("ttl").value) affinity.ttl = $("ttl").value;
          else {
            const currentRouting = await request(CPA + "/config/routing");
            if (!currentRouting["session-affinity-ttl"])
              throw new Error("routing.session-affinity-ttl");
            affinity.ttl = currentRouting["session-affinity-ttl"];
          }
          return {
            ...latest,
            prefix: latest?.prefix ?? state.prefix,
            affinity,
            groups,
          };
        });
      });
      $("delete").addEventListener("click", () => {
        setConfirm(true);
        $("confirm-cancel").focus();
      });
      $("confirm-cancel").addEventListener("click", () => {
        setConfirm(false);
        $("delete").focus();
      });
      // Deleting writes only the group list: the session switches below the
      // fields belong to Save.
      $("confirm-delete").addEventListener("click", async () => {
        await commit((latest, groups, index) => {
          groups.splice(index, 1);
          return { ...latest, groups };
        });
        if (!$("editor").hidden) {
          setConfirm(false);
          $("delete").focus();
        }
      });
      $("auth").addEventListener("submit", async (event) => {
        event.preventDefault();
        auth.key = $("auth-key").value.trim();
        auth.source = "typed";
        if (!auth.key) return;
        $("auth").hidden = true;
        await reload();
        if (auth.key && state) {
          storageSet(sessionStorage, SESSION_KEY, auth.key);
          auth.source = "session";
          $("auth-key").value = "";
        } else $("auth").hidden = false;
      });
      if (auth.key) reload();
      else {
        $("auth").hidden = false;
        $("groups").replaceChildren();
        showError("error", "No management key.");
      }
    </script>
  </body>
</html>
