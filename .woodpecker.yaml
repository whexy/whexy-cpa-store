variables:
  - &github_app
    GITHUB_APP_ID:
      from_secret: github_app_id
    GITHUB_APP_INSTALLATION_ID:
      from_secret: github_app_installation_id
    GITHUB_APP_PRIVATE_KEY:
      from_secret: github_app_private_key
  # The first Pod binds the local-path workspace; later steps follow its node.
  - &amd64
    kubernetes:
      nodeSelector:
        kubernetes.io/arch: amd64
  # Nix compiles every plugin with cgo, which exceeds the default step limits.
  - &nix_build
    kubernetes:
      nodeSelector:
        kubernetes.io/arch: amd64
      resources:
        requests:
          cpu: "2"
          memory: 4Gi
        limits:
          cpu: "4"
          memory: 6Gi

# A pipeline validates only what its changed files affect, as decided by
# release/validate.mjs. Pull requests merge without being rebased onto the
# latest main, so a default-branch push validates its changes again, together
# with every release the registry does not list yet, before it tags those
# releases at its commit. A tag pipeline builds and tests the one plugin it
# releases. The registry commits whexy-bot makes through its bypass contain
# only registry.json and start no pipeline.
when:
  - event: pull_request
  - event: push
    branch: ${CI_REPO_DEFAULT_BRANCH}
    path:
      exclude: [registry.json]
  - event: tag
    ref: refs/tags/*-v*
  - event: manual

labels:
  platform: linux/amd64

clone:
  - name: git
    image: woodpeckerci/plugin-git
    backend_options: *amd64

steps:
  - name: validate
    image: nixos/nix:2.35.2
    when:
      event: [pull_request, push, manual]
    backend_options: *nix_build
    commands:
      - echo "experimental-features = nix-command flakes" >> /etc/nix/nix.conf
      # The default container seccomp profile blocks the namespaces nix uses
      # for its build sandbox.
      - echo "sandbox = false" >> /etc/nix/nix.conf
      - nix shell --inputs-from . nixpkgs#nodejs_24 --command node release/validate.mjs

  - name: tag-releases
    image: node:24-bookworm-slim
    when:
      event: [push, manual]
      branch: ${CI_REPO_DEFAULT_BRANCH}
    backend_options: *amd64
    environment: *github_app
    commands:
      - node release/tag-releases.mjs

  - name: verify-tag
    image: node:24-bookworm-slim
    when:
      event: tag
    backend_options: *amd64
    commands:
      - node release/plugin-tag.mjs

  - name: build
    image: nixos/nix:2.35.2
    when:
      event: tag
    backend_options: *nix_build
    commands:
      - echo "experimental-features = nix-command flakes" >> /etc/nix/nix.conf
      # verify-tag proved the tag is <plugin-id>-v<declared pluginVersion>.
      - nix --option sandbox false build ".#plugins.$${CI_COMMIT_TAG%-v*}" --print-build-logs --out-link plugin
      - mkdir -p dist
      - cp -L plugin/*.zip dist/

  - name: publish-release
    image: node:24-bookworm-slim
    when:
      event: tag
    backend_options: *amd64
    environment: *github_app
    commands:
      - node release/publish-release.mjs

  - name: publish-registry
    image: node:24-bookworm-slim
    when:
      - event: tag
      - event: manual
        branch: ${CI_REPO_DEFAULT_BRANCH}
    backend_options: *amd64
    environment: *github_app
    commands:
      - node release/registry.mjs
