# Release pipeline, triggered by version tags (v*).
# 1. nix: run flake checks (formatting, lint, plugin build + tests), verify the
#    tag matches plugin.json versions, build release zips + registry.json.
# 2. release: upload zips as GitHub release assets.
# 3. update-registry: commit the generated registry.json back to main.
when:
  - event: tag
    ref: refs/tags/v*
steps:
  nix:
    # nixos/nix already contains git, which nix needs to read the workspace flake.
    image: nixos/nix:latest
    commands:
      - echo "experimental-features = nix-command flakes" >> /etc/nix/nix.conf
      # The default Docker seccomp profile blocks the namespaces nix uses for
      # its build sandbox.
      - nix --option sandbox false flake check --print-build-logs
      - nix --option sandbox false shell nixpkgs#jq -c ./scripts/check-tag-version.sh "${CI_COMMIT_TAG##v}"
      - nix --option sandbox false build .#plugins --print-build-logs --out-link dist-out
      - mkdir -p dist && cp -L dist-out/*.zip dist/
      - cp -L dist-out/registry.json registry.json
  release:
    image: alpine:3.21
    environment:
      GH_TOKEN:
        from_secret: github_token
    commands:
      - apk add --no-cache github-cli
      - gh release create "$CI_COMMIT_TAG" --repo "$CI_REPO" --title "$CI_COMMIT_TAG" --generate-notes dist/*.zip
  update-registry:
    image: alpine/git
    environment:
      GITHUB_TOKEN:
        from_secret: github_token
    commands:
      - cp registry.json /tmp/registry.json
      - git config --global user.email "woodpecker-ci@users.noreply.github.com"
      - git config --global user.name "woodpecker-ci"
      - git fetch origin main
      - git checkout main
      - cp /tmp/registry.json registry.json
      - git add registry.json
      - git commit -m "chore(registry): update registry.json for $CI_COMMIT_TAG" || echo "registry unchanged"
      - git push "https://x-access-token:$GITHUB_TOKEN@github.com/$CI_REPO.git" HEAD:main
