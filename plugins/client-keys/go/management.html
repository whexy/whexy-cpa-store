              busy === "rotate" ? "Rotating…" : "Rotate",
              () => rotateKey(key),
              { tone: "btn-primary", disabled },
            ),
            smallButton("Cancel", () => closePanel("rotate"), { disabled }),
            h("p", { class: "hint" }, "The current key stops working at once."),
            errorLine("rotate"),
          );
        }
        if (ui.panel === "delete") {
          const name = entryName(entryFor(key));
          return h(
            "div",
            { class: "panel" },
            h(
              "span",
              { class: "panel-text" },
              "Delete " +
                (name || mask(key.value)) +
                "? Clients using it are refused at once.",
            ),
            smallButton(
              busy === "delete" ? "Deleting…" : "Delete",
              () => deleteKey(key),
              { tone: "btn-danger-solid", disabled },
            ),
            smallButton("Cancel", () => closePanel("delete"), {
              focus: "delete-cancel",
              disabled,
            }),
            errorLine("delete"),
          );
        }
        return null;
      }

      function buildSection(def, key, entry) {
        const titleId = "sec-" + def.type;
        const parts = def.render({
          key,
          entry,
          policy: policiesOf(entry)[def.type],
          titleId,
          disabled: busy !== null,
        });
        return h(
          "section",
          { class: "sec", "aria-labelledby": titleId },
          h(
            "div",
            { class: "sec-head" },
            h("h3", { id: titleId }, def.title),
            parts.control
              ? h("div", { class: "sec-control" }, parts.control)
              : null,
          ),
          parts.body,
          errorLine(def.type),
        );
      }

      function buildAddForm() {
        const disabled = busy !== null;
        const keyInput = textInput(
          {
            class: "input input-mono",
            id: "add-key",
            placeholder: "sk-…",
            "data-focus": "add-key",
            disabled,
          },
          ui.add.key,
          (value) => (ui.add.key = value),
        );
        const form = h(
          "form",
          { class: "add-form", "aria-labelledby": "add-title" },
          h("h2", { id: "add-title" }, "New key"),
          h(
            "div",
            { class: "field" },
            h("label", { for: "add-key" }, "Key"),
            h(
              "div",
              { class: "row" },
              keyInput,
              smallButton(
                "Generate",
                () => {
                  ui.add.key = generateKey();
                  keyInput.value = ui.add.key;
                },
                { tone: "", focus: "add-generate", disabled },
              ),
            ),
          ),
          h(
            "label",
            { class: "field" },
            "Name",
            textInput(
              {
                maxlength: NAME_MAX,
                placeholder: "Optional",
                "data-focus": "add-name",
                disabled,
              },
              ui.add.name,
              (value) => (ui.add.name = value),
            ),
          ),
          h(
            "label",
            { class: "field" },
            "Note",
            textInput(
              {
                maxlength: NOTE_MAX,
                placeholder: "Optional",
                "data-focus": "add-note",
                disabled,
              },
              ui.add.note,
              (value) => (ui.add.note = value),
            ),
          ),
          h(
            "div",
            { class: "row" },
            smallButton(busy === "add" ? "Adding…" : "Add", null, {
              tone: "btn-primary",
              submit: true,
              focus: "add-submit",
              disabled,
            }),
            state.keys.length > 0
              ? smallButton("Cancel", closeAdd, { disabled })
              : null,
          ),
          errorLine("add"),
        );
        form.addEventListener("submit", (event) => {
          event.preventDefault();
          addKey();
        });
        return form;
      }

      function renderDetail() {
        const pane = $("detail");
        if (ui.adding || state.keys.length === 0) {
          pane.replaceChildren(buildAddForm());
          return;
        }
        const key = selectedKey();
        if (!key) {
          pane.replaceChildren();
          return;
        }
        const entry = entryFor(key);
        const error = keyError(key);
        const parts = [
          buildHeader(key, entry),
          error
            ? h(
                "div",
                { class: "alert" },
                h(
                  "strong",
                  {},
                  "Requests with this key are refused until this is fixed.",
                ),
                h("span", {}, error),
              )
            : null,
          buildPanel(key),
          ...POLICIES.map((def) => buildSection(def, key, entry)),
        ].filter(Boolean);
        pane.replaceChildren(...parts);
      }

      function focusIdOf(el) {
        return el && el !== document.body && el.dataset
          ? el.dataset.focus || null
          : null;
      }

      // Re-rendering replaces the controls, so focus is carried over by
      // data-focus id: the explicit target if given, else the control that
      // had focus.
      function renderAll(target) {
        const focusId = target || focusIdOf(document.activeElement);
        renderAlerts();
        renderList();
        renderDetail();
        if (!focusId) return;
        const el = document.querySelector(
          '[data-focus="' + CSS.escape(focusId) + '"]',
        );
        if (!el || el.disabled || el.closest("[hidden]")) return;
        if (document.activeElement !== el) el.focus();
        if (el.tagName === "INPUT" && el.type === "text") {
          el.setSelectionRange(el.value.length, el.value.length);
        }
      }

      // UI actions
      function clearPanelErrors() {
        for (const where of ["name", "note", "rotate", "delete"])
          errors.delete(where);
      }

      function resetKeyUi() {
        ui.panel = null;
        ui.revealed = false;
        ui.allMatches = false;
        clearPanelErrors();
        for (const def of POLICIES) errors.delete(def.type);
      }

      function select(value) {
        if (ui.selected !== value || ui.adding) {
          ui.selected = value;
          ui.adding = false;
          errors.delete("add");
          resetKeyUi();
        }
        renderAll();
      }

      function openPanel(panel) {
        const key = selectedKey();
        if (!key) return;
        const entry = entryFor(key);
        clearPanelErrors();
        ui.panel = panel;
        if (panel === "rename") ui.nameDraft = entryName(entry);
        if (panel === "note") ui.noteDraft = entryNote(entry);
        if (panel === "rotate") ui.rotateDraft = "";
        renderAll(
          {
            rename: "name-input",
            note: "note-input",
            rotate: "rotate-input",
            delete: "delete-cancel",
          }[panel],
        );
      }

      function closePanel(where) {
        ui.panel = null;
        errors.delete(where);
        const key = selectedKey();
        const hasNote = key && entryNote(entryFor(key));
        renderAll(
          where === "name"
            ? "name"
            : where === "note" && hasNote
              ? "note"
              : "menu",
        );
      }

      function openAdd() {
        ui.adding = true;
        errors.delete("add");
        renderAll("add-key");
      }

      function closeAdd() {
        ui.adding = false;
        ui.add = { key: "", name: "", note: "" };
        errors.delete("add");
        const key = selectedKey();
        renderAll(key ? "item-" + key.scope : "add-open");
      }

      // Data
      async function ensureFingerprints(values) {
        const missing = [...new Set(values)].filter(
          (value) => !fingerprints.has(value),
        );
        if (missing.length === 0) return;
        const body = { keys: missing };
        if (apiBase) body.api_base = apiBase;
        const data = await api("POST", PLUGIN + "/fingerprints", body);
        const list =
          data && Array.isArray(data.fingerprints) ? data.fingerprints : [];
        if (list.length !== missing.length) {
          throw new Error(
            "The plugin returned " +
              list.length +
              " fingerprints for " +
              missing.length +
              " keys.",
          );
        }
        missing.forEach((value, index) => {
          const item = objectOr(list[index]);
          const scope =
            typeof item.scope === "string" ? item.scope.toLowerCase() : "";
          if (!/^[0-9a-f]{64}$/.test(scope))
            throw new Error("The plugin returned an invalid key fingerprint.");
          fingerprints.set(value, {
            scope,
            nameFp:
              typeof item.name_fingerprint === "string"
                ? item.name_fingerprint
                : "",
          });
        });
      }

      async function freshKeyList() {
        const list = await getOr(KEY_LIST, []);
        return Array.isArray(list)
          ? list.filter((value) => typeof value === "string")
          : [];
      }

      async function loadStatus() {
        try {
          const status = await api("GET", PLUGIN + "/status");
          state.statusError = "";
          return status && typeof status === "object" ? status : null;
        } catch (err) {
          if (err instanceof AuthError) throw err;
          state.statusError = err.message;
          return null;
        }
      }

      async function loadData() {
        const [list, config, status] = await Promise.all([
          freshKeyList(),
          getOr(PLUGIN_CONFIG, {}),
          loadStatus(),
        ]);
        await ensureFingerprints(list);
        state.keys = list.map((value) => ({
          value,
          ...fingerprints.get(value),
        }));
        state.config = objectOr(config);
        indexEntries();
        state.status = status;
        state.localNames = readLocalNames();
        state.loaded = true;
        if (!selectedKey()) {
          ui.selected = state.keys.length > 0 ? state.keys[0].value : null;
          resetKeyUi();
        }
        if (state.keys.length === 0) ui.adding = true;
        for (const [scope, draft] of drafts) {
          const key = state.keys.find((item) => item.scope === scope);
          const saved = key
            ? savedModels(policiesOf(entryFor(key)).models)
            : null;
          if (!saved || !modelsDirty(saved, draft)) drafts.delete(scope);
        }
        $("loading").hidden = true;
        renderAll();
      }

      function modelIds(list) {
        if (!Array.isArray(list)) return null;
        const ids = new Set();
        for (const item of list) {
          const id =
            typeof item === "string"
              ? item
              : item && typeof item.id === "string"
                ? item.id
                : "";
          if (id) ids.add(id);
        }
        return [...ids].sort((a, b) => a.localeCompare(b));
      }

      // /v1/models goes first: the plugin records the unfiltered list while
      // serving it, even when the first key is itself restricted.
      async function loadCatalog() {
        let direct = null;
        const first = state.keys[0];
        if (first) {
          try {
            const response = await fetch(BASE + "/v1/models", {
              headers: { Authorization: "Bearer " + first.value },
              cache: "no-store",
              credentials: "omit",
            });
            if (response.ok) direct = modelIds((await response.json()).data);
          } catch (_) {}
        }
        let captured = null;
        try {
          captured = modelIds(
            objectOr(await api("GET", PLUGIN + "/models")).models,
          );
        } catch (err) {
          if (err instanceof AuthError) return;
        }
        const ids = captured && captured.length > 0 ? captured : direct;
        state.catalog = ids && ids.length > 0 ? ids : null;
        renderAll();
      }

      async function statusGeneration() {
        try {
          const status = await api("GET", PLUGIN + "/status");
          if (status && typeof status.generation === "number")
            return status.generation;
        } catch (err) {
          if (err instanceof AuthError) throw err;
        }
        return state.status && typeof state.status.generation === "number"
          ? state.status.generation
          : -1;
      }

      // Every config write reloads CLIProxyAPI asynchronously; the plugin
      // bumps its generation once it has applied the new config.
      async function waitApplied(before) {
        for (let i = 0; i < POLL_TRIES; i++) {
          await sleep(POLL_MS);
          let status = null;
          try {
            status = await api("GET", PLUGIN + "/status");
          } catch (err) {
            if (err instanceof AuthError) throw err;
          }
          if (
            status &&
            typeof status.generation === "number" &&
            status.generation > before
          ) {
            notice = "";
            await loadData();
            return;
          }
        }
        await loadData();
        notice = "Saved, but the plugin has not applied the change yet.";
      }

      function settle(pluginChanged, before) {
        return pluginChanged ? waitApplied(before) : loadData();
      }

      async function write(where, work) {
        if (busy) return;
        const restore = focusIdOf(document.activeElement);
        busy = where;
        errors.delete(where);
        afterWriteFocus = null;
        renderAll();
        try {
          await work();
        } catch (err) {
          if (!(err instanceof AuthError)) errors.set(where, err.message);
        } finally {
          busy = null;
          const target = focusIdOf(document.activeElement)
            ? null
            : afterWriteFocus || restore;
          afterWriteFocus = null;
          renderAll(target);
        }
      }

      function lengthProblem(name, note) {
        if (chars(name) > NAME_MAX)
          return "Names are limited to " + NAME_MAX + " characters.";
        if (chars(note) > NOTE_MAX)
          return "Notes are limited to " + NOTE_MAX + " characters.";
        return "";
      }

      function saveText(key, field, raw) {
        const value = clean(raw);
        const problem =
          field === "name"
            ? lengthProblem(value, "")
            : lengthProblem("", value);
        if (problem) {
          errors.set(field, problem);
          renderAll();
          return;
        }
        const entry = entryFor(key);
        const current = field === "name" ? entryName(entry) : entryNote(entry);
        if (value === current) {
          closePanel(field);
          return;
        }
        write(field, async () => {
          const before = await statusGeneration();
          const url = entryUrl(storedScope(key.scope)) + "/" + field;
          let changed = true;
          if (value) await api("PUT", url, value);
          else changed = await remove(url);
          ui.panel = null;
          afterWriteFocus = field === "name" ? "name" : value ? "note" : "menu";
          await settle(changed, before);
        });
      }

      const saveName = (key) => saveText(key, "name", ui.nameDraft);
      const saveNote = (key) => saveText(key, "note", ui.noteDraft);

      function addKey() {
        const value = ui.add.key.trim();
        const name = clean(ui.add.name);
        const note = clean(ui.add.note);
        const problem =
          keyProblem(
            value,
            state.keys.map((key) => key.value),
          ) || lengthProblem(name, note);
        if (problem) {
          errors.set("add", problem);
          renderAll();
          return;
        }
        write("add", async () => {
          await ensureFingerprints([value]);
          const { scope } = fingerprints.get(value);
          const entry = {};
          if (name) entry.name = name;
          if (note) entry.note = note;
          const withEntry = Object.keys(entry).length > 0;
          const before = withEntry ? await statusGeneration() : -1;
          const list = await freshKeyList();
          if (list.includes(value)) throw new Error("This key already exists.");
          const intended = [...list, value];
          const patch = { access: { "api-keys": intended } };
          if (withEntry) {
            patch.plugins = {
              configs: {
                "client-keys": { keys: { [storedScope(scope)]: entry } },
              },
            };
          }
          listChanged = false;
          await api("PATCH", CONFIG, patch);
          await checkKeyList(intended);
          ui.adding = false;
          ui.add = { key: "", name: "", note: "" };
          ui.selected = value;
          resetKeyUi();
          afterWriteFocus = "item-" + scope;
          await settle(withEntry, before);
          if (!state.catalog) loadCatalog();
        });
      }

      function rotateKey(key) {
        const value = ui.rotateDraft.trim();
        const problem = keyProblem(
          value,
          state.keys.map((item) => item.value),
        );
        if (problem) {
          errors.set("rotate", problem);
          renderAll();
          return;
        }
        write("rotate", async () => {
          await ensureFingerprints([value]);
          const { scope } = fingerprints.get(value);
          const oldStored = storedScope(key.scope);
          const entry = objectOr(await getOr(entryUrl(oldStored), null));
          const carry = Object.keys(entry).length > 0;
          // Settings left behind for the new value would merge into the
          // rotated key's.
          const stale = entryNames.get(scope);
          const pluginChanged = carry || stale !== undefined;
          const before = pluginChanged ? await statusGeneration() : -1;
          const list = await freshKeyList();
          if (!list.includes(key.value))
            throw new Error(
              "This key is no longer configured. Reload to see the current keys.",
            );
          if (list.includes(value)) throw new Error("This key already exists.");
          const intended = list.map((item) =>
            item === key.value ? value : item,
          );
          const patch = { access: { "api-keys": intended } };
          if (carry) {
            patch.plugins = {
              configs: { "client-keys": { keys: { [scope]: entry } } },
            };
          }
          if (stale !== undefined) await remove(entryUrl(stale));
          listChanged = false;
          await api("PATCH", CONFIG, patch);
          await checkKeyList(intended);
          if (carry) await remove(entryUrl(oldStored));
          if (drafts.has(key.scope)) {
            drafts.set(scope, drafts.get(key.scope));
            drafts.delete(key.scope);
          }
          ui.selected = value;
          ui.panel = null;
          ui.rotateDraft = "";
          afterWriteFocus = "copy";
          await settle(pluginChanged, before);
        });
      }

      function deleteKey(key) {
        write("delete", async () => {
          const before = await statusGeneration();
          const list = await freshKeyList();
          const next = list.filter((item) => item !== key.value);
          listChanged = false;
          if (next.length !== list.length) await api("PUT", KEY_LIST, next);
          await checkKeyList(next);
          const removed = await remove(entryUrl(storedScope(key.scope)));
          drafts.delete(key.scope);
          const index = state.keys.findIndex(
            (item) => item.value === key.value,
          );
          const rest = state.keys.filter((item) => item.value !== key.value);
          const neighbor = rest[Math.min(Math.max(index, 0), rest.length - 1)];
          ui.selected = neighbor ? neighbor.value : null;
          resetKeyUi();
          afterWriteFocus = neighbor ? "item-" + neighbor.scope : "add-key";
          await settle(removed, before);
        });
      }

      // There is no compare-and-swap on access.api-keys: a write landing
      // between our read and our whole-list write is lost or revived.
      async function checkKeyList(intended) {
        listChanged = !sameMembers(await freshKeyList(), intended);
      }

      function removeStrays(entries) {
        write("strays", async () => {
          const before = await statusGeneration();
          let changed = false;
          for (const item of entries) {
            if (await remove(entryUrl(item.stored))) changed = true;
          }
          confirmStrays = false;
          afterWriteFocus = "filter";
          await settle(changed, before);
        });
      }

      function importNames(candidates) {
        write("import", async () => {
          const before = await statusGeneration();
          const keys = {};
          for (const item of candidates) keys[item.scope] = { name: item.name };
          await api("PATCH", CONFIG, {
            plugins: { configs: { "client-keys": { keys } } },
          });
          await waitApplied(before);
        });
      }

      // Static controls
      $("filter").addEventListener("input", () => {
        ui.filter = $("filter").value;
        renderList();
      });
      $("add-open").addEventListener("click", openAdd);
      $("list").addEventListener("keydown", (event) => {
        if (event.key !== "ArrowDown" && event.key !== "ArrowUp") return;
        const items = [...$("list").querySelectorAll(".item")];
        const index = items.indexOf(document.activeElement);
        if (index < 0) return;
        event.preventDefault();
        const step = event.key === "ArrowDown" ? 1 : -1;
        const next =
          items[Math.min(items.length - 1, Math.max(0, index + step))];
        next.focus();
        next.click();
      });

      function showPageError(message) {
        pageError = message;
        renderAlerts();
      }

      async function refresh() {
        showPageError("");
        try {
          await loadData();
          loadCatalog();
        } catch (err) {
          if (!(err instanceof AuthError)) {
            $("loading").hidden = true;
            showPageError(err.message);
          }
        }
      }

      $("reload").addEventListener("click", async () => {
        $("reload").disabled = true;
        notice = "";
        listChanged = false;
        confirmStrays = false;
        await refresh();
        $("reload").disabled = false;
      });

      // Authentication
      function showContent() {
        $("auth").hidden = true;
        $("content").hidden = false;
        $("bar-actions").hidden = false;
      }

      function showAuth(message) {
        $("content").hidden = true;
        $("bar-actions").hidden = true;
        $("auth").hidden = false;
        $("auth-error").textContent = message;
        $("auth-error").hidden = !message;
        $("auth-key").value = "";
        $("auth-key").focus();
      }

      $("auth").addEventListener("submit", async (event) => {
        event.preventDefault();
        const typed = $("auth-key").value.trim();
        if (!typed) return;
        auth.key = typed;
        auth.source = "typed";
        const submit = $("auth-submit");
        submit.disabled = true;
        try {
          await loadData();
          storageSet(sessionStorage, SESSION_KEY, typed);
          auth.source = "session";
          showContent();
          loadCatalog();
        } catch (err) {
          if (!(err instanceof AuthError)) {
            $("auth-error").textContent = err.message;
            $("auth-error").hidden = false;
          }
        } finally {
          submit.disabled = false;
        }
      });

      Object.assign(auth, resolveKey());
      if (auth.key) {
        showContent();
        refresh();
      } else {
        showAuth("");
      }
    </script>
  </body>
</html>
