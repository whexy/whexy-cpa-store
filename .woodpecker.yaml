# Release pipeline, triggered by plugin-scoped version tags:
# <plugin-id>-v<version>.
# 1. nix: run flake checks, verify the selected plugin version, build all
#    plugins to regenerate the registry, and stage only the selected artifact.
# 2. release: upload that plugin's zip as a GitHub release asset.
# 3. update-registry: commit the regenerated registry.json back to main.
when:
  - event: tag
    ref: refs/tags/*-v*
steps:
  nix:
    # nixos/nix already contains git, which nix needs to read the workspace flake.
    image: nixos/nix:latest
    commands:
      - echo "experimental-features = nix-command flakes" >> /etc/nix/nix.conf
      # The default Docker seccomp profile blocks the namespaces nix uses for
      # its build sandbox.
      - nix --option sandbox false flake check --print-build-logs
      - nix --option sandbox false shell nixpkgs#jq -c ./scripts/dist-plugin.sh "$CI_COMMIT_TAG"
  release:
    image: alpine:3.21
    environment:
      GH_TOKEN:
        from_secret: github_token
    commands:
      - apk add --no-cache github-cli
      # Idempotent so the pipeline can be re-run after a later step fails.
      - gh release view "$CI_COMMIT_TAG" --repo "$CI_REPO" >/dev/null 2>&1 || gh release create "$CI_COMMIT_TAG" --repo "$CI_REPO" --title "$CI_COMMIT_TAG" --generate-notes dist/*.zip
  update-registry:
    image: alpine/git
    environment:
      GITHUB_TOKEN:
        from_secret: github_token
    commands:
      - cp registry.json /tmp/registry.json
      - git config --global user.email "woodpecker-ci@users.noreply.github.com"
      - git config --global user.name "woodpecker-ci"
      - git fetch origin main
      - git checkout main
      - cp /tmp/registry.json registry.json
      - git add registry.json
      - 'git commit -m "chore(registry): update registry.json for $CI_COMMIT_TAG" || echo "registry unchanged"'
      - git push "https://x-access-token:$GITHUB_TOKEN@github.com/$CI_REPO.git" HEAD:main
